name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install -r requirements.txt pytest ruff
      - name: Lint (syntax errors and undefined names only)
        run: ruff check --select E9,F63,F7,F82 .
      - name: Unit tests (synthetic data)
        run: pytest -q
